name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Lint, test, secrets, vuln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: Unit and UI snapshot tests
        run: go test -race ./...
      - name: Secrets-leak test
        run: make test-secrets
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build static binary
        run: make build

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: make fuzz
        run: make fuzz FUZZTIME=10s

  integration:
    name: Docker integration suite
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: make itest
        run: make itest

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, fuzz, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
      id-token: write # Sigstore keyless signing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Only GitHub-owned actions may run in this repository (docs/decisions.md
      # "Repository settings"), so the release tools are built from source at
      # pinned versions, verified against the Go checksum database.
      - name: Install GoReleaser, syft and cosign
        run: |
          go install github.com/goreleaser/goreleaser/v2@v2.19.0
          go install github.com/anchore/syft/cmd/syft@v1.55.0
          go install github.com/sigstore/cosign/v3/cmd/cosign@v3.1.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Release notes from CHANGELOG.md
        run: .github/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
      - name: GoReleaser
        run: goreleaser release --clean --release-notes "$RUNNER_TEMP/notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
