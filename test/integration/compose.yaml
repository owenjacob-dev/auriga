# Docker Compose stack for `make itest`.
#
# Three stellar-core validators on a private network passphrase, plus an
# SSH bastion. host-a and host-b are published on localhost; host-c is
# reachable only through the bastion (ProxyJump). host-b refuses port
# forwarding and has no curl, so the admin endpoint fallback runs
# `stellar-core http-command`. Seeds are public test vectors; tests never
# point at testnet or pubnet.
name: auriga-itest

x-host: &host
  build:
    context: ../..
    dockerfile: test/integration/host/Dockerfile
  image: auriga-itest-host:latest
  platform: linux/amd64
  init: true
  volumes:
    - ./.work/keys:/keys:ro
  healthcheck:
    test: ["CMD-SHELL", "test -s /home/op/.ssh/authorized_keys && pgrep -x sshd"]
    interval: 2s
    retries: 60

x-validator: &validator
  <<: *host
  healthcheck:
    test: ["CMD-SHELL", "pgrep -x sshd && curl -sf http://127.0.0.1:11626/info >/dev/null || stellar-core --conf /etc/stellar/stellar-core.cfg http-command info >/dev/null 2>&1"]
    interval: 3s
    retries: 100

x-quorum: &quorum
  PEERS: host-a:11625 host-b:11625 host-c:11625
  QUORUM_VALIDATORS: >-
    itest-a:GBRPYHIL2CI3FNQ4BXLFMNDLFJUNPU2HY3ZMFSHONUCEOASW7QC7OX2H
    itest-b:GAB2CB576PHBBPQ5ODORRZ2LYCMWPZGWGCN2KDK7DXOIMZASKUY3QZ6Q
    itest-c:GDVEU3DD4KOFECV66VIHWEZOYX4ZKR3WV27L464SIIPOU2IUI3JCZA57

services:
  bastion:
    <<: *host
    networks: [front, back]
    ports: ["127.0.0.1:2220:22"]

  host-a:
    <<: *validator
    networks: [front, core]
    ports: ["127.0.0.1:2221:22"]
    environment:
      <<: *quorum
      SUDO_MODE: nopasswd
      NODE_SEED_VALUE: SDHOAMBNLGCE2MV5ZKIVZAQD3VCLGP53P3OBSBI6UN5L5XZI5TKHFQL4
      NODE_ALIAS: itest-a

  host-b:
    <<: *validator
    networks: [front, core]
    ports: ["127.0.0.1:2222:22"]
    environment:
      <<: *quorum
      SUDO_MODE: password
      NO_FORWARDING: "1"
      NO_CURL: "1"
      NODE_SEED_VALUE: SAAACAQDAQCQMBYIBEFAWDANBYHRAEISCMKBKFQXDAMRUGY4DUPB6NKI
      NODE_ALIAS: itest-b

  host-c:
    <<: *validator
    networks: [back, core]
    environment:
      <<: *quorum
      SUDO_MODE: nopasswd
      NODE_SEED_VALUE: SADQOBYHA4DQOBYHA4DQOBYHA4DQOBYHA4DQOBYHA4DQOBYHA4DQP54X
      NODE_ALIAS: itest-c

networks:
  front: {}
  back:
    internal: true
  core:
    internal: true
